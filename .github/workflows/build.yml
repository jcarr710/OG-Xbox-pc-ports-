# Builds every game's exe and release zips on each push and pull request.
# Pushing a tag <game>-v<version> (jsrf-v0.1.0, mc3-v0.1.0) also drafts a
# GitHub release with that game's zips, its checksums, and its section of
# CHANGELOG.md as the notes.
name: build
on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (32-bit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 make zip

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: for t in jsrf mc3; do make dist T=$t; done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          game=${GITHUB_REF_NAME%%-v*}
          version=${GITHUB_REF_NAME#*-v}
          product=$(sed -n 's/^#define TITLE_PRODUCT *"\(.*\)"/\1/p' "titles/$game/version.h")
          built=$(sed -n 's/^#define TITLE_VERSION_STR *"\(.*\)"/\1/p' "titles/$game/version.h")
          if [ "$built" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match titles/$game/version.h ($built)"; exit 1
          fi
          # this game's section of the changelog
          awk -v h="## $product $version" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          pkg="$game-pc-$version"
          gh release create "$GITHUB_REF_NAME" "dist/$pkg-windows.zip" "dist/$pkg-source.zip" "dist/SHA256SUMS-$pkg.txt" \
            --draft --title "$product $version" --notes-file notes.md

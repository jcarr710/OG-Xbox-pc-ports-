# Builds jsrf.exe and the release zips on every push and pull request.
# Pushing a tag like v0.1.0 also creates a draft GitHub release with the zips.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (32-bit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 make zip

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: jsrf-pc-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt
          --draft --title "JSRF PC ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
